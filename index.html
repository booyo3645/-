<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Калор тооцогч</title>
  <style>
    /* Basic page styling */
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      color: #555;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      background: #28a745;
      color: #fff;
      border: none;
      padding: 12px;
      margin-top: 20px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #218838;
    }

    .result {
      text-align: center;
      font-size: 1.2em;
      margin-top: 20px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Калор тооцогч</h1>
    <label for="хүйс">Хүйс</label>
    <select id="хүйс">
      <option value="эрэгтэй">Эрэгтэй</option>
      <option value="эмэгтэй">Эмэгтэй</option>
    </select>

    <label for="нас">Нас</label>
    <input type="тоо" id="нас" placeholder="Нас" />

    <label for="биеийн жин">Биеийн жин (кг)</label>
    <input type="тоо" id="жин" placeholder="Жин" />

    <label for="height">Өндөр (см)</label>
    <input type="тоо" id="өндөр" placeholder="Өндөр" />

    <label for="activity">Activity Level</label>
    <select id="activity">
      <option value="1.2">Sedentary (little or no exercise)</option>
      <option value="1.375">Lightly active (light exercise/sports 1-3 days/week)</option>
      <option value="1.55">Moderately active (moderate exercise/sports 3-5 days/week)</option>
      <option value="1.725">Very active (hard exercise/sports 6-7 days a week)</option>
      <option value="1.9">Super active (very hard exercise/sports & physical job)</option>
    </select>

    <button onclick="calculateCalories()">Calculate Calories</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function calculateCalories() {
      // Retrieve input values
      const gender = document.getElementById('gender').value;
      const age = parseFloat(document.getElementById('age').value);
      const weight = parseFloat(document.getElementById('weight').value);
      const height = parseFloat(document.getElementById('height').value);
      const activity = parseFloat(document.getElementById('activity').value);

      // Basic input validation
      if (isNaN(age) || isNaN(weight) || isNaN(height)) {
        alert("Please fill in all fields correctly.");
        return;
      }

      let bmr;
      // Calculate BMR using the Mifflin-St Jeor equation
      if (gender === 'male') {
        bmr = 10 * weight + 6.25 * height - 5 * age + 5;
      } else {
        bmr = 10 * weight + 6.25 * height - 5 * age - 161;
      }

      // Calculate daily calorie needs by multiplying BMR by activity factor
      const dailyCalories = Math.round(bmr * activity);

      // Display the result
      document.getElementById('result').innerHTML =
        `Your daily calorie need is approximately <strong>${dailyCalories} calories</strong>.`;
    }
  </script>
</body>
</html>
